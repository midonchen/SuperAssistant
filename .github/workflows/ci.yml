name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superassistant
          POSTGRES_PASSWORD: superassistant
          POSTGRES_DB: superassistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superassistant -d superassistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install -e services/api[dev]
      - name: Alembic migration check (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://superassistant:superassistant@localhost:5432/superassistant
        run: |
          cd services/api
          alembic upgrade head
      - name: Governance checks
        run: npm run check:all
      - name: API tests
        run: pytest -q services/api/tests
