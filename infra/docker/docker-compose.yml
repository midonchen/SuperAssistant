version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: superassistant
      POSTGRES_PASSWORD: superassistant
      POSTGRES_DB: superassistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://superassistant:superassistant@postgres:5432/superassistant
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: celery -A core.celery_app:celery_app worker -l info
    environment:
      DATABASE_URL: postgresql+psycopg://superassistant:superassistant@postgres:5432/superassistant
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: celery -A core.celery_app:celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+psycopg://superassistant:superassistant@postgres:5432/superassistant
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
