version: '3.9'

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://superassistant:${POSTGRES_PASSWORD:-superassistant}@postgres:5432/superassistant
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  OFFLINE_QUEUE_REDIS_URL: ${OFFLINE_QUEUE_REDIS_URL:-redis://redis:6379/2}
  AI_QUOTA_REDIS_URL: ${AI_QUOTA_REDIS_URL:-redis://redis:6379/3}
  STT_PROVIDER: ${STT_PROVIDER:-local}
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  SUPERASSISTANT_ADMIN_PHONES: ${SUPERASSISTANT_ADMIN_PHONES:-13900139000}
  SUPERASSISTANT_AUDITOR_PHONES: ${SUPERASSISTANT_AUDITOR_PHONES:-13900139001}
  SUPERASSISTANT_MAX_ACTIVE_SESSIONS: ${SUPERASSISTANT_MAX_ACTIVE_SESSIONS:-3}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: superassistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superassistant}
      POSTGRES_DB: superassistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  admin:
    build:
      context: ../../apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://agint.sonmuu.com:8000/api/v1}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.1.0}
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: celery -A core.celery_app:celery_app worker -l info
    environment: *app-env
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: celery -A core.celery_app:celery_app beat -l info
    environment: *app-env
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
