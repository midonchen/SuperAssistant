openapi: 3.1.0
info:
  title: SuperAssistant API
  version: 1.1.0
  description: MVP v1 baseline APIs with core admin endpoints.
servers:
  - url: /api/v1
components:
  parameters:
    XRequestId:
      in: header
      name: X-Request-Id
      required: true
      schema:
        type: string
    XAppVersion:
      in: header
      name: X-App-Version
      required: true
      schema:
        type: string
    XPlatform:
      in: header
      name: X-Platform
      required: true
      schema:
        type: string
        enum: [ios, android, web-admin]
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BaseSuccess:
      type: object
      required: [code, message, request_id, timestamp, data]
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: object
    BaseError:
      type: object
      required: [code, message, request_id, timestamp, retriable]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
        retriable:
          type: boolean
    UserProfile:
      type: object
      required: [user_id, phone_masked, timezone, shopping_day, shopping_cycle, role, onboarded]
      properties:
        user_id:
          type: string
          format: uuid
        phone_masked:
          type: string
        timezone:
          type: string
        shopping_day:
          type: integer
        shopping_cycle:
          type: integer
        role:
          type: string
          enum: [USER, ADMIN, AUDITOR]
        household_id:
          type: string
          format: uuid
          nullable: true
        subscription_tier:
          type: string
          enum: [free, pro]
        onboarded:
          type: boolean
    InventoryItem:
      type: object
      required:
        - household_id
        - item_key
        - item_name
        - unit
        - current_stock
        - max_stock
        - warning_threshold
        - status
        - daily_avg_rate
        - last_calibrated
        - last_updated
        - server_version
      properties:
        household_id:
          type: string
          format: uuid
        item_key:
          type: string
        item_name:
          type: string
        unit:
          type: string
        current_stock:
          type: number
        max_stock:
          type: number
        warning_threshold:
          type: number
        status:
          type: string
          enum: [PLENTY, WARNING, CRITICAL, EMPTY]
        daily_avg_rate:
          type: number
        last_calibrated:
          type: string
          format: date-time
        last_updated:
          type: string
          format: date-time
        server_version:
          type: integer
    ActivityLog:
      type: object
      required:
        - activity_id
        - household_id
        - item_key
        - action_type
        - operation
        - delta_value
        - before_value
        - after_value
        - timestamp
      properties:
        activity_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        item_key:
          type: string
        action_type:
          type: string
          enum: [OCR, VOICE, MANUAL, AUTO_DECAY, CALIBRATE, ADMIN_REVIEW]
        operation:
          type: string
          enum: [ADD, SET, SUBTRACT, CLEAR]
        delta_value:
          type: number
        before_value:
          type: number
        after_value:
          type: number
        raw_text:
          type: string
          nullable: true
        confidence:
          type: number
          nullable: true
        operator_role:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    ParsedEntity:
      type: object
      required: [item_key, operation, value, unit, normalized_value, normalized_unit, confidence, parse_session_id]
      properties:
        item_key:
          type: string
        operation:
          type: string
          enum: [ADD, SET, SUBTRACT, CLEAR]
        value:
          type: number
        unit:
          type: string
        normalized_value:
          type: number
        normalized_unit:
          type: string
        confidence:
          type: number
        parse_session_id:
          type: string
    PurchaseSuggestion:
      type: object
      properties:
        suggestion_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        mode:
          type: string
          enum: [AUTO, MANUAL]
        status:
          type: string
          enum: [PENDING, DONE, DISMISSED]
        items:
          type: array
          items:
            type: object
            properties:
              item_key:
                type: string
              suggested_qty:
                type: number
              unit:
                type: string
              reason:
                type: string
    Category:
      type: object
      required: [category_id, name, unit_type, is_system, created_at]
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
          nullable: true
        unit_type:
          type: string
        decay_template:
          type: object
          nullable: true
          additionalProperties: true
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time
    HouseholdMember:
      type: object
      required: [user_id, phone_masked, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        phone_masked:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER, VIEWER]
        joined_at:
          type: string
          format: date-time
    Household:
      type: object
      required: [household_id, name, created_by, members, created_at]
      properties:
        household_id:
          type: string
          format: uuid
        name:
          type: string
        created_by:
          type: string
          format: uuid
        members:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdMember'
        created_at:
          type: string
          format: date-time
    HouseholdInvitation:
      type: object
      required: [invitation_id, household_id, invite_code, status, expires_at, created_at]
      properties:
        invitation_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        invite_code:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    MonthlyReportEntry:
      type: object
      required: [item_key, item_name, unit, consumed_qty, wasted_qty]
      properties:
        item_key:
          type: string
        item_name:
          type: string
        unit:
          type: string
        consumed_qty:
          type: number
        wasted_qty:
          type: number
        turnover_days:
          type: number
          nullable: true
    ConsumptionReport:
      type: object
      required: [report_id, household_id, month, generated_at, total_consumed_qty, total_wasted_qty, top_consumed, wasted, turnover, suggested_purchase]
      properties:
        report_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        month:
          type: string
        generated_at:
          type: string
          format: date-time
        total_consumed_qty:
          type: number
        total_wasted_qty:
          type: number
        top_consumed:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyReportEntry'
        wasted:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyReportEntry'
        turnover:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyReportEntry'
        suggested_purchase:
          type: array
          items:
            type: object
            properties:
              item_key: { type: string }
              suggested_qty: { type: number }
              unit: { type: string }
              reason: { type: string }
paths:
  /auth/sms/send:
    post:
      summary: Send SMS code
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { type: string }
                purpose:
                  type: string
                  enum: [LOGIN, DELETE_ACCOUNT]
      responses:
        '200': { description: success }
  /auth/sms/login:
    post:
      summary: Login by SMS code
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, device_id]
              properties:
                phone: { type: string }
                code: { type: string }
                device_id: { type: string }
      responses:
        '200': { description: success }
  /auth/token/refresh:
    post:
      summary: Refresh token
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_id]
              properties:
                refresh_token: { type: string }
                device_id: { type: string }
      responses:
        '200': { description: success }
  /auth/logout:
    post:
      summary: Logout session
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        '200': { description: success }
  /auth/account:
    delete:
      summary: Delete account
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verify_code]
              properties:
                verify_code: { type: string }
                reason: { type: string }
      responses:
        '200': { description: success }
  /categories:
    get:
      summary: List custom and system categories
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
      responses:
        '200': { description: success }
    post:
      summary: Create a custom category
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, unit_type]
              properties:
                name: { type: string, minLength: 1, maxLength: 32 }
                icon: { type: string, maxLength: 64, nullable: true }
                unit_type: { type: string, minLength: 1, maxLength: 16 }
                decay_template: { type: object, nullable: true, additionalProperties: true }
      responses:
        '200': { description: success }
        '409': { description: conflict }
  /categories/{category_id}:
    patch:
      summary: Update a custom category
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: category_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 32 }
                icon: { type: string, maxLength: 64, nullable: true }
                unit_type: { type: string, minLength: 1, maxLength: 16 }
                decay_template: { type: object, nullable: true, additionalProperties: true }
      responses:
        '200': { description: success }
        '403': { description: forbidden (system category) }
        '404': { description: not found }
    delete:
      summary: Delete a custom category
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: category_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: success }
        '403': { description: forbidden (system category) }
        '404': { description: not found }
        '409': { description: conflict (category has activity history) }
  /households/me:
    get:
      summary: Get current household
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
      responses:
        '200': { description: success }
        '404': { description: not found }
  /households:
    post:
      summary: Create a household
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: success }
        '409': { description: conflict (must leave current household first) }
  /households/invitations:
    post:
      summary: Create a household invitation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [ADMIN, MEMBER, VIEWER], default: MEMBER }
      responses:
        '200': { description: success }
        '403': { description: forbidden (OWNER/ADMIN role required) }
  /households/join:
    post:
      summary: Join a household by invite code
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code: { type: string, minLength: 4, maxLength: 16 }
      responses:
        '200': { description: success }
        '404': { description: not found (invalid invite code) }
        '410': { description: gone (invitation expired) }
  /inventory/items:
    get:
      summary: Get inventory list
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - in: query
          name: status
          schema:
            type: string
            enum: [PLENTY, WARNING, CRITICAL, EMPTY]
      responses:
        '200': { description: success }
  /inventory/operations/batch:
    post:
      summary: Batch inventory operations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  items:
                    type: object
                    required: [item_key, operation, value, unit, source]
                    properties:
                      item_key: { type: string }
                      operation: { type: string, enum: [ADD, SET, SUBTRACT, CLEAR] }
                      value: { type: number }
                      unit: { type: string }
                      source: { type: string, enum: [VOICE, OCR, MANUAL] }
                      op_id: { type: string }
                      client_version: { type: integer }
      responses:
        '200': { description: success }
  /inventory/offline/replay:
    post:
      summary: Enqueue offline operations for replay
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offline_ops]
              properties:
                offline_ops:
                  type: array
                  items:
                    type: object
                    required: [op_id, payload]
                    properties:
                      op_id: { type: string }
                      created_at: { type: string, format: date-time }
                      retry_count: { type: integer, minimum: 0 }
                      payload:
                        type: object
                        required: [operations]
                        properties:
                          operations:
                            type: array
                            items:
                              type: object
                              required: [item_key, operation, value, unit, source]
                              properties:
                                item_key: { type: string }
                                operation: { type: string, enum: [ADD, SET, SUBTRACT, CLEAR] }
                                value: { type: number }
                                unit: { type: string }
                                source: { type: string, enum: [VOICE, OCR, MANUAL] }
                                op_id: { type: string }
                                client_version: { type: integer }
      responses:
        '200': { description: success }
  /inventory/logs:
    get:
      summary: Get inventory logs
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: item_key
          schema: { type: string }
      responses:
        '200': { description: success }
  /inventory/items/{item_key}/calibrate:
    post:
      summary: Calibrate one inventory item
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: item_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, unit]
              properties:
                value: { type: number }
                unit: { type: string }
      responses:
        '200': { description: success }
  /ai/voice/parse:
    post:
      summary: Parse voice input
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audio_url, locale]
              properties:
                audio_url: { type: string }
                locale: { type: string }
      responses:
        '200': { description: success }
  /ai/ocr/parse:
    post:
      summary: Parse OCR input
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_urls]
              properties:
                image_urls:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200': { description: success }
  /ai/parse/confirm:
    post:
      summary: Confirm parse and apply inventory updates
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, entities]
              properties:
                session_id: { type: string }
                entities:
                  type: array
                  items:
                    $ref: '#/components/schemas/ParsedEntity'
      responses:
        '200': { description: success }
  /suggestions/generate:
    post:
      summary: Generate purchase suggestions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [AUTO, MANUAL]
      responses:
        '200': { description: success }
  /suggestions/latest:
    get:
      summary: Get latest suggestion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
      responses:
        '200': { description: success }
  /push/device/register:
    post:
      summary: Register push device
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, device_token]
              properties:
                platform: { type: string }
                device_token: { type: string }
      responses:
        '200': { description: success }
  /push/preference:
    put:
      summary: Update push preference
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, notify_time]
              properties:
                enabled: { type: boolean }
                notify_time: { type: string }
      responses:
