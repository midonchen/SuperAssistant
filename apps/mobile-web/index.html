<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SuperAssistant</title>
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --text: #1a1d24; --muted: #6b7280; --faint: #9ca3af;
  --line: #ececf1;
  --mint: #4de0b6; --work: #4f8afe; --violet: #7a56fe; --amber: #f5b94b;
  --success: #34c77b; --warning: #f5b94b; --red: #e5534b;
  --grad: linear-gradient(135deg, #4de0b6, #7a56fe);
  --teal: #14b8a6;
  --shadow: 0 8px 24px rgba(20,30,60,.06);
  --soft: #eef0f5;
  --gold: #7a56fe; --green: #4de0b6; --blue: #4f8afe;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; min-height: 100vh; }
.hidden { display: none !important; }
#login { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 24px; gap: 14px; }
#login h1 { color: var(--text); font-size: 22px; text-align: center; margin-bottom: 8px; }
#login input { background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 14px; border-radius: 12px; font-size: 16px; }
#login button { background: var(--grad); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; box-shadow: var(--shadow); }
.hint { color: var(--muted); font-size: 12px; text-align: center; }
#app { display: flex; flex-direction: column; min-height: 100vh; }
header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
header h2 { font-size: 17px; }
header .gold { color: var(--violet); }
main { flex: 1; padding: 14px 16px 84px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); }
nav button { flex: 1; background: none; border: none; color: var(--muted); padding: 10px 4px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; align-items: center; }
nav button[data-tab="life"].active { color: var(--mint); }
nav button[data-tab="work"].active { color: var(--work); }
nav button[data-tab="rel"].active { color: var(--violet); }
nav button[data-tab="career"].active { color: var(--amber); }
nav button[data-tab="growth"].active { color: var(--teal); }
nav .ic { font-size: 18px; }
.subnav { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
.subnav button { background: var(--soft); color: var(--muted); border: none; padding: 7px 14px; border-radius: 18px; font-size: 13px; white-space: nowrap; }
.subnav.life button.active { background: var(--mint); color: #fff; font-weight: 600; }
.subnav.work button.active { background: var(--work); color: #fff; font-weight: 600; }
.subnav.growth button.active { background: var(--teal); color: #fff; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.card .title { font-size: 15px; font-weight: 600; word-break: break-all; }
.card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }
.card .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.card .actions button { background: var(--soft); color: var(--text); border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; }
.card .actions button.danger { color: var(--red); }
.card .actions button.primary { background: var(--grad); color: #fff; font-weight: 600; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.badge.DONE, .badge.PLENTY { color: var(--success); }
.badge.OVERDUE, .badge.已逾期, .badge.EMPTY { color: var(--red); }
.badge.CRITICAL { color: var(--red); }
.badge.WARNING { color: var(--warning); }
.badge.ai { color: var(--violet); } .badge.heuristic { color: var(--work); }
.section { margin: 16px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.empty { color: var(--faint); text-align: center; padding: 32px 0; font-size: 13px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar input, .toolbar select, textarea { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 12px; border-radius: 10px; font-size: 14px; }
.toolbar button { background: var(--grad); color: #fff; border: none; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; }
textarea { width: 100%; min-height: 80px; resize: vertical; margin-bottom: 8px; font-family: inherit; }
.summary { white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: var(--text); background: #f7f7fa; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.placeholder { text-align: center; padding: 80px 24px; color: var(--muted); }
.placeholder .big { font-size: 42px; margin-bottom: 12px; }
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #2b313b; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 99; max-width: 90%; }
</style>
</head>
<body>

<div id="login">
  <h1>SuperAssistant</h1>
  <input id="phone" type="tel" placeholder="手机号" value="">
  <input id="code" type="text" placeholder="验证码（演示用 123456）" value="123456">
  <button onclick="doLogin()">登录</button>
  <div class="hint">演示环境：任意手机号 + 验证码 123456</div>
</div>

<div id="app" class="hidden">
  <header>
    <h2><span class="gold">✦</span> SuperAssistant</h2>
    <button style="background:none;border:none;color:var(--muted);font-size:13px;" onclick="logout()">退出</button>
  </header>
  <main id="main"></main>
  <nav>
    <button class="active" data-tab="life" onclick="switchTab('life')"><span class="ic">🏠</span>生活</button>
    <button data-tab="work" onclick="switchTab('work')"><span class="ic">💼</span>工作</button>
    <button data-tab="rel" onclick="switchTab('rel')"><span class="ic">💗</span>关系</button>
    <button data-tab="growth" onclick="switchTab('growth')"><span class="ic">🌱</span>成长</button>
  </nav>
</div>

<div id="toast" class="hidden"></div>

<script>
const API = localStorage.getItem('sa_api_base') || 'http://agint.sonmuu.com:8000/api/v1';
let token = localStorage.getItem('sa_token') || '';
let tab = 'life';
let subTab = 'inventory';

const SUB_TABS = {
  life: [['inventory','库存'],['shop','采购'],['family','家庭'],['reminders','提醒']],
  work: [['employment','就业'],['startup','创业']],
  growth: [['knowledge','知识'],['habits','习惯'],['finance','财务'],['reflect','自省'],['interests','兴趣'],['skills','技能']],
};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 2500); }
function idem(){ return 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2,7); }

async function api(path, {method='GET', body, idemKey}={}) {
  const h = {'X-Request-Id':'web','X-App-Version':'1.1.0','X-Platform':'web-mobile','Content-Type':'application/json'};
  if (token) h['Authorization'] = 'Bearer ' + token;
  if (idemKey || method !== 'GET') h['Idempotency-Key'] = idemKey || idem();
  const res = await fetch(API + path, {method, headers:h, body: body ? JSON.stringify(body) : undefined});
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error(data.message || data.code || ('HTTP ' + res.status));
  return data.data;
}

async function doLogin() {
  try {
    const phone = document.getElementById('phone').value.trim();
    const code = document.getElementById('code').value.trim() || '123456';
    if (!phone) { toast('请输入手机号'); return; }
    const data = await api('/auth/sms/login', {method:'POST', body:{phone, code, device_id:'web-mobile-'+phone}, idemKey:'login-'+Date.now()});
    token = data.access_token;
    localStorage.setItem('sa_token', token);
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    switchTab('life');
  } catch(e) { toast(e.message); }
}

function logout(){ token=''; localStorage.removeItem('sa_token'); location.reload(); }

function switchTab(t){
  tab = t;
  subTab = t === 'life' ? 'inventory' : (t === 'work' ? 'employment' : (t === 'growth' ? 'knowledge' : ''));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}
function switchSub(k){ subTab = k; render(); }

async function render(){
  const m = document.getElementById('main');
  try {
    if (tab==='life' || tab==='work' || tab==='growth') await renderSub(m);
    else if (tab==='rel') await renderRelations(m);
  } catch(e){ m.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; }
}

async function renderSub(m){
  const tabs = SUB_TABS[tab];
  m.innerHTML = '<div class="subnav ' + tab + '">' + tabs.map(([k,label])=>`<button class="${k===subTab?'active':''}" onclick="switchSub('${k}')">${label}</button>`).join('') + '</div><div id="sub-body" class="empty"></div>';
  const body = document.getElementById('sub-body');
  const fn = {inventory:renderLife, shop:renderShop, family:renderFamily, reminders:renderReminders, employment:renderEmployment, startup:renderStartup, knowledge:renderKnowledge, habits:renderHabits, finance:renderFinance, reflect:renderReflect, interests:renderInterests, skills:renderLifeSkills}[subTab];
  if (fn) await fn(body);
}

/* ============ 生活·库存（含品类） ============ */
async function renderLife(m){
  m.innerHTML = `
    <div class="card">
      <button class="primary" style="background:var(--green);color:#111;border:none;padding:12px 16px;border-radius:10px;font-weight:600;width:100%;" onclick="suggestMeal()">🍳 今晚吃什么</button>
      <div id="meal-box"></div>
    </div>
    <div class="section">库存</div>
    <div id="inv-list" class="empty">加载中…</div>
    <div class="section">品类</div>
    <div class="toolbar">
      <input id="cat-name" placeholder="新品类名">
      <input id="cat-unit" placeholder="单位" style="max-width:70px;">
      <button onclick="addCategory()">添加</button>
    </div>
    <div id="cat-list" class="empty"></div>`;
  await loadInventory(); await loadCategories();
}
async function loadInventory(){
  const d = await api('/inventory/items');
  const el = document.getElementById('inv-list');
  if(!d.items.length){ el.innerHTML = '<div class="empty">暂无库存，先添加品类再入库</div>'; return; }
  el.innerHTML = d.items.map(i=>`
    <div class="card">
      <div class="row"><span class="title">${esc(i.item_name)}</span><span class="badge ${i.status}">${esc(i.status||'')}</span></div>
      <div class="meta">库存 ${i.current_stock} ${esc(i.unit)} · 预警阈值 ${i.warning_threshold}</div>
      <div class="actions">
        <button class="primary" onclick="stockOp('${i.item_key}','${esc(i.unit)}','ADD')">入库</button>
        <button onclick="stockOp('${i.item_key}','${esc(i.unit)}','SUBTRACT')">出库</button>
      </div>
    </div>`).join('');
}
async function suggestMeal(){
  const box = document.getElementById('meal-box');
  box.innerHTML = '<div class="empty">生成中…</div>';
  try {
    const d = await api('/meals/suggest', {method:'POST', body:{}});
    box.innerHTML = '<div class="meta" style="white-space:pre-wrap;line-height:1.6;">'+esc(d.suggestion)+'</div>';
  } catch(e){ box.innerHTML = ''; toast(e.message); }
}
async function stockOp(key, unit, op){
  const qty = prompt((op==='ADD'?'入库':'出库')+'数量（'+unit+'）：', '1');
  if(!qty) return;
  try {
    await api('/inventory/operations/batch', {method:'POST', body:{operations:[{item_key:key, operation:op, value:parseFloat(qty), unit, source:'MANUAL'}]}});
    await loadInventory();
  } catch(e){ toast(e.message); }
}
async function loadCategories(){
  const d = await api('/categories');
  const el = document.getElementById('cat-list');
  if(!d.categories.length){ el.innerHTML = '<div class="empty">无品类</div>'; return; }
  el.innerHTML = d.categories.map(c=>`
    <div class="card">
      <div class="row"><span class="title">${esc(c.icon||'')} ${esc(c.name)}</span><span class="badge">${c.is_system?'系统':'自定义'}</span></div>
      <div class="meta">单位 ${esc(c.unit_type)}</div>
    </div>`).join('');
}
async function addCategory(){
  const name = document.getElementById('cat-name').value.trim();
  const unit = document.getElementById('cat-unit').value.trim() || '个';
  if(!name){ toast('请输入品类名'); return; }
  try { await api('/categories', {method:'POST', body:{name, icon:'📦', unit_type:unit}}); document.getElementById('cat-name').value=''; document.getElementById('cat-unit').value=''; await loadCategories(); }
  catch(e){ toast(e.message); }
}

/* ============ 生活·采购（建议 + 报告） ============ */
async function renderShop(m){
  m.innerHTML = `
    <div class="toolbar"><button onclick="genSuggestion()">生成采购建议</button></div>
    <div id="sug-list" class="empty"></div>
    <div class="section">本月消费报告</div>
    <div id="report-box" class="empty"></div>`;
  await loadSuggestion(); await loadReport();
}
async function loadSuggestion(){
  try {
    const d = await api('/suggestions/latest');
    const s = d.suggestion;
    const el = document.getElementById('sug-list');
    if(!s.items || !s.items.length){ el.innerHTML = '<div class="empty">暂无采购建议，点击「生成」</div>'; return; }
    el.innerHTML = '<div class="section">采购建议</div>' + s.items.map(i=>`
      <div class="card">
        <div class="row"><span class="title">${esc(i.item_key)}</span><span class="badge">${i.suggested_qty} ${esc(i.unit)}</span></div>
        <div class="meta">${esc(i.reason||'')}</div>
      </div>`).join('');
  } catch(e){ toast(e.message); }
}
async function genSuggestion(){
  try { await api('/suggestions/generate', {method:'POST', body:{mode:'AUTO'}}); await loadSuggestion(); } catch(e){ toast(e.message); }
}
async function loadReport(){
  const month = new Date().toISOString().slice(0,7);
  try {
    const d = await api('/reports/consumption/monthly?month='+month);
    const r = d.report;
    document.getElementById('report-box').innerHTML = `<div class="card"><div class="meta">${esc(r.month)} · 总消耗 ${r.total_consumed_qty} · 总浪费 ${r.total_wasted_qty}</div></div>`;
  } catch(e){ document.getElementById('report-box').innerHTML = '<div class="empty">暂无报告</div>'; }
}

/* ============ 生活·家庭 ============ */
async function renderFamily(m){
  m.innerHTML = `
    <div id="fam-info" class="empty">加载中…</div>
    <div class="toolbar">
      <input id="join-code" placeholder="输入邀请码加入家庭">
      <button onclick="joinFamily()">加入</button>
    </div>
    <button class="primary" style="background:var(--grad);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;margin-bottom:10px;" onclick="invite()">生成邀请码</button>
    <div id="invite-box"></div>`;
  await loadFamily();
}
async function loadFamily(){
  try {
    const d = await api('/households/me');
    const h = d.household;
    document.getElementById('fam-info').innerHTML = `
      <div class="card">
        <div class="row"><span class="title">${esc(h.name||'我的家')}</span><span class="badge">${(h.members||[]).length} 成员</span></div>
        ${(h.members||[]).map(mm=>`<div class="meta">· ${esc(mm.phone_masked||'成员')}（${esc(mm.role||'')}）</div>`).join('')}
      </div>`;
  } catch(e){ document.getElementById('fam-info').innerHTML = '<div class="empty">暂无家庭</div>'; }
}
async function invite(){
  try { const d = await api('/households/invitations', {method:'POST', body:{role:'MEMBER'}}); document.getElementById('invite-box').innerHTML = `<div class="card">邀请码：<b>${esc(d.invitation.invite_code)}</b></div>`; }
  catch(e){ toast(e.message); }
}
async function joinFamily(){
  const code = document.getElementById('join-code').value.trim();
  if(!code){ toast('请输入邀请码'); return; }
  try { await api('/households/join', {method:'POST', body:{invite_code:code}}); document.getElementById('join-code').value=''; await loadFamily(); } catch(e){ toast(e.message); }
}

/* ============ 生活·提醒（健康 + 缴费） ============ */
async function renderReminders(m){
  m.innerHTML = `
    <div class="card">
      <div class="section" style="margin:0 0 8px;">健康用药提醒</div>
      <div class="toolbar">
        <input id="hr-member" placeholder="成员" style="max-width:70px;">
        <input id="hr-title" placeholder="事项（如降压药）" style="max-width:120px;">
        <input id="hr-days" placeholder="周期天数" style="max-width:76px;" inputmode="numeric">
      </div>
      <button class="primary" style="background:var(--green);color:#111;border:none;padding:10px 16px;border-radius:10px;font-weight:600;" onclick="addHealthReminder()">添加健康提醒</button>
      <div id="health-list" class="empty">加载中…</div>
    </div>
    <div class="card">
      <div class="section" style="margin:0 0 8px;">生活缴费提醒</div>
      <div class="toolbar">
        <input id="br-name" placeholder="账单（水费/电费）" style="max-width:130px;">
        <input id="br-amount" placeholder="金额" style="max-width:70px;" inputmode="numeric">
        <input id="br-months" placeholder="周期月" style="max-width:70px;" inputmode="numeric">
      </div>
      <button class="primary" style="background:var(--green);color:#111;border:none;padding:10px 16px;border-radius:10px;font-weight:600;" onclick="addBillReminder()">添加缴费提醒</button>
      <div id="bill-list" class="empty">加载中…</div>
    </div>`;
  await Promise.all([loadHealthReminders(), loadBillReminders()]);
}
async function loadHealthReminders(){
  const d = await api('/health-reminders');
  const el = document.getElementById('health-list');
  if(!d.reminders.length){ el.innerHTML = '<div class="empty">暂无健康提醒</div>'; return; }
  const TY = {medication:'用药', checkup:'体检', followup:'复诊'};
  el.innerHTML = d.reminders.map(r=>{
    const due = r.next_due_at ? new Date(r.next_due_at) : null;
    const overdue = due && due < new Date();
    return `<div class="card">
      <div class="row"><span class="title">${esc(r.member_name)} · ${esc(r.title)}</span><span class="badge ${overdue?'OVERDUE':''}">${TY[r.reminder_type]||r.reminder_type}</span></div>
      <div class="meta">周期 ${r.period_days} 天${r.next_due_at?' · 下次 '+r.next_due_at.slice(0,10):''}${r.enabled?'':' · 已暂停'}</div>
      <div class="actions"><button class="danger" onclick="delHealthReminder('${r.reminder_id}')">删除</button></div>
    </div>`;
  }).join('');
}
async function addHealthReminder(){
  const member = document.getElementById('hr-member').value.trim();
  const title = document.getElementById('hr-title').value.trim();
  const days = document.getElementById('hr-days').value.trim();
  if(!member || !title) return toast('请输入成员和事项');
  try {
    await api('/health-reminders', {method:'POST', body:{member_name:member, title:title, period_days:days?parseInt(days,10):1}});
    document.getElementById('hr-member').value='';
    document.getElementById('hr-title').value='';
    document.getElementById('hr-days').value='';
    toast('已添加健康提醒');
    await loadHealthReminders();
  } catch(e){ toast(e.message); }
}
async function delHealthReminder(id){
  try { await api('/health-reminders/'+id, {method:'DELETE'}); await loadHealthReminders(); }
  catch(e){ toast(e.message); }
}
async function loadBillReminders(){
  const d = await api('/bill-reminders');
  const el = document.getElementById('bill-list');
  if(!d.reminders.length){ el.innerHTML = '<div class="empty">暂无缴费提醒</div>'; return; }
  el.innerHTML = d.reminders.map(r=>{
    const due = r.next_due_at ? new Date(r.next_due_at) : null;
    const overdue = due && due < new Date();
    return `<div class="card">
      <div class="row"><span class="title">${esc(r.name)}</span><span class="badge ${overdue?'OVERDUE':''}">${overdue?'已到期':'待缴'}</span></div>
      <div class="meta">${r.amount?'¥'+r.amount+' · ':''}周期 ${r.period_months} 月${r.next_due_at?' · 下次 '+r.next_due_at.slice(0,10):''}${r.enabled?'':' · 已暂停'}</div>
      <div class="actions"><button class="danger" onclick="delBillReminder('${r.reminder_id}')">删除</button></div>
    </div>`;
  }).join('');
}
async function addBillReminder(){
  const name = document.getElementById('br-name').value.trim();
  const amount = document.getElementById('br-amount').value.trim();
  const months = document.getElementById('br-months').value.trim();
  if(!name) return toast('请输入账单名');
  try {
    await api('/bill-reminders', {method:'POST', body:{name:name, amount:amount?parseFloat(amount):null, period_months:months?parseInt(months,10):1}});
    document.getElementById('br-name').value='';
    document.getElementById('br-amount').value='';
    document.getElementById('br-months').value='';
    toast('已添加缴费提醒');
    await loadBillReminders();
  } catch(e){ toast(e.message); }
}
async function delBillReminder(id){
  try { await api('/bill-reminders/'+id, {method:'DELETE'}); await loadBillReminders(); }
  catch(e){ toast(e.message); }
}

/* ============ 关系 ============ */
async function renderRelations(m){
  m.innerHTML = `
    <div class="card">
      <div class="section" style="margin:0 0 8px;">添加重要的人</div>
      <div class="toolbar">
        <input id="ct-name" placeholder="姓名" style="max-width:100px;">
        <input id="ct-rel" placeholder="关系" style="max-width:80px;">

  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth()+1, 1);
  const s = fmtDate(start), e = fmtDate(end);
  const d = await api('/calendar/events?start_date='+s+'&end_date='+e);
  m.innerHTML = `
    <div class="row" style="margin-bottom:12px;">
      <div class="section" style="margin:0;">${now.getFullYear()} 年 ${now.getMonth()+1} 月</div>
      <div style="display:flex;gap:8px;">
        <button style="background:var(--grad);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;" onclick="downloadIcs()">下载 .ics</button>
        <button style="background:#eef0f5;color:var(--text);border:none;padding:8px 14px;border-radius:8px;font-weight:600;" onclick="copyShareUrl()">订阅链接</button>
      </div>
    </div>
    <div id="cal-list"></div>`;
  const el = document.getElementById('cal-list');
  if(!d.events.length){ el.innerHTML = '<div class="empty">本月暂无日程</div>'; return; }
  el.innerHTML = d.events.map(ev=>`
    <div class="card">
      <div class="row"><span class="title">${esc(ev.title)}</span><span class="badge">${ev.source==='meeting'?'会议':ev.source==='occasion'?'纪念日':'任务'}</span></div>
      <div class="meta">${esc((ev.start_at||'').slice(0,16).replace('T',' '))}</div>
    </div>`).join('');
}
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function downloadIcs(){
  try {
    const res = await fetch(API + '/calendar/ical', {headers:{'Authorization':'Bearer '+token, 'X-Request-Id':'web','X-App-Version':'1.1.0','X-Platform':'web-mobile'}});
    if(!res.ok){ toast('导出失败'); return; }
    const blob = await res.blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'calendar.ics'; a.click();
  } catch(e){ toast(e.message); }
}
async function copyShareUrl(){
  try {
    const d = await api('/calendar/share');
    const url = API + '/calendar/ical/public?token=' + encodeURIComponent(d.token);
    try { await navigator.clipboard.writeText(url); toast('订阅链接已复制'); }
    catch(e){ prompt('复制此订阅链接：', url); }
  } catch(e){ toast(e.message); }
}

async function renderMeetings(m){
  m.innerHTML = `
    <div class="card">
      <div class="section" style="margin:0 0 8px;">新建会议</div>
      <input id="mt-title" placeholder="会议标题" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;margin-bottom:8px;font-size:14px;">
      <textarea id="mt-transcript" placeholder="粘贴会议转写文本…（支持 待办：xxx）"></textarea>
      <button class="primary" style="background:var(--grad);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;" onclick="addMeeting()">生成摘要</button>
    </div>
    <div id="meeting-list" class="empty">加载中…</div>`;
  await loadMeetings();
}
async function loadMeetings(){
  const d = await api('/meetings');
  const el = document.getElementById('meeting-list');
  if(!d.meetings.length){ el.innerHTML = '<div class="empty">暂无会议</div>'; return; }
  el.innerHTML = d.meetings.map(mt=>`
    <div class="card">
      <div class="row"><span class="title">${esc(mt.title)}</span></div>
      <div class="meta">${esc((mt.summary||'（无摘要）').slice(0,120))}</div>
      ${mt.action_items.length?`<div class="section">待办</div>`+mt.action_items.map(a=>`
        <div class="row" style="padding:6px 0;"><span style="font-size:13px;${a.done?'text-decoration:line-through;color:var(--muted);':''}">${esc(a.text)}${a.assignee?' · '+esc(a.assignee):''}</span>${a.done?'<span class="badge DONE">完成</span>':'<button style="background:#eef0f5;color:var(--text);border:none;padding:5px 10px;border-radius:6px;" onclick="doneItem(\''+a.action_item_id+'\')">完成</button>'}</div>`).join(''):''}
    </div>`).join('');
}
async function addMeeting(){
  const title = document.getElementById('mt-title').value.trim();
  const transcript = document.getElementById('mt-transcript').value.trim();
  if(!title || !transcript){ toast('请填写标题和转写内容'); return; }
  try { await api('/meetings', {method:'POST', body:{title, transcript}}); document.getElementById('mt-title').value=''; document.getElementById('mt-transcript').value=''; await loadMeetings(); }
  catch(e){ toast(e.message); }
}
async function doneItem(id){ try { await api('/meetings/action-items/'+id, {method:'PATCH', body:{done:true}}); await loadMeetings(); } catch(e){ toast(e.message); } }

async function renderReports(m){
  m.innerHTML = `
    <div class="toolbar">
      <input id="wr-week" type="date">
      <button onclick="genReport()">生成周报</button>
    </div>
    <div id="report-list" class="empty">加载中…</div>`;
  await loadReports();
}
async function loadReports(){
  const d = await api('/weekly-reports');
  const el = document.getElementById('report-list');
  if(!d.reports.length){ el.innerHTML = '<div class="empty">暂无周报</div>'; return; }
  el.innerHTML = d.reports.map(r=>`
    <div class="card">
      <div class="row"><span class="title">周报 ${esc(r.week_start)}</span><span class="badge">${esc((r.generated_at||'').slice(0,10))}</span></div>
      <div class="summary" style="margin-top:10px;">${esc(r.content)}</div>
    </div>`).join('');
}
async function genReport(){
  const week = document.getElementById('wr-week').value;
  try { await api('/weekly-reports/generate' + (week?'?week_start='+week:''), {method:'POST'}); await loadReports(); }
  catch(e){ toast(e.message); }
}

/* boot */
if (token) {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  switchTab('life');
}
</script>
</body>
</html>
