<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SuperAssistant</title>
<style>
:root {
  --bg: #0f1115; --card: #1a1d24; --text: #e8eaf0; --muted: #8b93a3;
  --gold: #e5be45; --green: #34c77b; --red: #e5534b; --blue: #4d9fff; --line: #262a33;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; min-height: 100vh; }
.hidden { display: none !important; }
#login { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 24px; gap: 14px; }
#login h1 { color: var(--gold); font-size: 22px; text-align: center; margin-bottom: 8px; }
#login input { background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 14px; border-radius: 12px; font-size: 16px; }
#login button { background: var(--gold); color: #111; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; text-align: center; }
#app { display: flex; flex-direction: column; min-height: 100vh; }
header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
header h2 { font-size: 17px; }
header .gold { color: var(--gold); }
main { flex: 1; padding: 14px 16px 84px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); }
nav button { flex: 1; background: none; border: none; color: var(--muted); padding: 10px 4px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; align-items: center; }
nav button.active { color: var(--gold); }
nav .ic { font-size: 18px; }
.subnav { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
.subnav button { background: #2a2f3a; color: var(--muted); border: none; padding: 7px 14px; border-radius: 18px; font-size: 13px; white-space: nowrap; }
.subnav button.active { background: var(--gold); color: #111; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.card .title { font-size: 15px; font-weight: 600; word-break: break-all; }
.card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }
.card .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.card .actions button { background: #2a2f3a; color: var(--text); border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; }
.card .actions button.danger { color: var(--red); }
.card .actions button.primary { background: var(--gold); color: #111; font-weight: 600; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #2a2f3a; color: var(--muted); white-space: nowrap; }
.badge.DONE, .badge.PLENTY { color: var(--green); }
.badge.OVERDUE, .badge.已逾期, .badge.EMPTY { color: var(--red); }
.badge.CRITICAL { color: var(--red); }
.badge.WARNING { color: var(--gold); }
.badge.ai { color: var(--gold); } .badge.heuristic { color: var(--blue); }
.section { margin: 16px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.empty { color: var(--muted); text-align: center; padding: 32px 0; font-size: 13px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar input, .toolbar select, textarea { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); color: var(--text); padding: 12px; border-radius: 10px; font-size: 14px; }
.toolbar button { background: var(--gold); color: #111; border: none; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; }
textarea { width: 100%; min-height: 80px; resize: vertical; margin-bottom: 8px; font-family: inherit; }
.summary { white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: var(--text); background: #15181e; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.placeholder { text-align: center; padding: 80px 24px; color: var(--muted); }
.placeholder .big { font-size: 42px; margin-bottom: 12px; }
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #2a2f3a; color: var(--text); padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 99; max-width: 90%; }
</style>
</head>
<body>

<div id="login">
  <h1>SuperAssistant</h1>
  <input id="phone" type="tel" placeholder="手机号" value="">
  <input id="code" type="text" placeholder="验证码（演示用 123456）" value="123456">
  <button onclick="doLogin()">登录</button>
  <div class="hint">演示环境：任意手机号 + 验证码 123456</div>
</div>

<div id="app" class="hidden">
  <header>
    <h2><span class="gold">✦</span> SuperAssistant</h2>
    <button style="background:none;border:none;color:var(--muted);font-size:13px;" onclick="logout()">退出</button>
  </header>
  <main id="main"></main>
  <nav>
    <button class="active" data-tab="life" onclick="switchTab('life')"><span class="ic">🏠</span>生活</button>
    <button data-tab="work" onclick="switchTab('work')"><span class="ic">💼</span>工作</button>
    <button data-tab="rel" onclick="switchTab('rel')"><span class="ic">💗</span>关系</button>
    <button data-tab="career" onclick="switchTab('career')"><span class="ic">🎯</span>职业</button>
  </nav>
</div>

<div id="toast" class="hidden"></div>

<script>
const API = localStorage.getItem('sa_api_base') || 'http://agint.sonmuu.com:8000/api/v1';
let token = localStorage.getItem('sa_token') || '';
let tab = 'life';
let subTab = 'inventory';

const SUB_TABS = {
  life: [['inventory','库存'],['shop','采购'],['family','家庭']],
  work: [['tasks','任务'],['calendar','日历'],['meetings','会议'],['reports','周报']],
};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 2500); }
function idem(){ return 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2,7); }

async function api(path, {method='GET', body, idemKey}={}) {
  const h = {'X-Request-Id':'web','X-App-Version':'1.1.0','X-Platform':'web-mobile','Content-Type':'application/json'};
  if (token) h['Authorization'] = 'Bearer ' + token;
  if (idemKey || method !== 'GET') h['Idempotency-Key'] = idemKey || idem();
  const res = await fetch(API + path, {method, headers:h, body: body ? JSON.stringify(body) : undefined});
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error(data.message || data.code || ('HTTP ' + res.status));
  return data.data;
}

async function doLogin() {
  try {
    const phone = document.getElementById('phone').value.trim();
    const code = document.getElementById('code').value.trim() || '123456';
    if (!phone) { toast('请输入手机号'); return; }
    const data = await api('/auth/sms/login', {method:'POST', body:{phone, code, device_id:'web-mobile-'+phone}, idemKey:'login-'+Date.now()});
    token = data.access_token;
    localStorage.setItem('sa_token', token);
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    switchTab('life');
  } catch(e) { toast(e.message); }
}

function logout(){ token=''; localStorage.removeItem('sa_token'); location.reload(); }

function switchTab(t){
  tab = t;
  subTab = t === 'life' ? 'inventory' : (t === 'work' ? 'tasks' : '');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}
function switchSub(k){ subTab = k; render(); }

async function render(){
  const m = document.getElementById('main');
  try {
    if (tab==='life' || tab==='work') await renderSub(m);
    else if (tab==='rel') await renderRelations(m);
    else if (tab==='career') renderCareer(m);
  } catch(e){ m.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; }
}

async function renderSub(m){
  const tabs = SUB_TABS[tab];
  m.innerHTML = '<div class="subnav">' + tabs.map(([k,label])=>`<button class="${k===subTab?'active':''}" onclick="switchSub('${k}')">${label}</button>`).join('') + '</div><div id="sub-body" class="empty"></div>';
  const body = document.getElementById('sub-body');
  const fn = {inventory:renderLife, shop:renderShop, family:renderFamily, tasks:renderTasks, calendar:renderCalendar, meetings:renderMeetings, reports:renderReports}[subTab];
  if (fn) await fn(body);
}

/* ============ 生活·库存（含品类） ============ */
async function renderLife(m){
  m.innerHTML = `
    <div class="section">库存</div>
    <div id="inv-list" class="empty">加载中…</div>
    <div class="section">品类</div>
    <div class="toolbar">
      <input id="cat-name" placeholder="新品类名">
      <input id="cat-unit" placeholder="单位" style="max-width:70px;">
      <button onclick="addCategory()">添加</button>
    </div>
    <div id="cat-list" class="empty"></div>`;
  await loadInventory(); await loadCategories();
}
async function loadInventory(){
  const d = await api('/inventory/items');
  const el = document.getElementById('inv-list');
  if(!d.items.length){ el.innerHTML = '<div class="empty">暂无库存，先添加品类再入库</div>'; return; }
  el.innerHTML = d.items.map(i=>`
    <div class="card">
      <div class="row"><span class="title">${esc(i.item_name)}</span><span class="badge ${i.status}">${esc(i.status||'')}</span></div>
      <div class="meta">库存 ${i.current_stock} ${esc(i.unit)} · 预警阈值 ${i.warning_threshold}</div>
      <div class="actions">
        <button class="primary" onclick="stockOp('${i.item_key}','${esc(i.unit)}','ADD')">入库</button>
        <button onclick="stockOp('${i.item_key}','${esc(i.unit)}','SUBTRACT')">出库</button>
      </div>
    </div>`).join('');
}
async function stockOp(key, unit, op){
  const qty = prompt((op==='ADD'?'入库':'出库')+'数量（'+unit+'）：', '1');
  if(!qty) return;
  try {
    await api('/inventory/operations/batch', {method:'POST', body:{operations:[{item_key:key, operation:op, value:parseFloat(qty), unit, source:'MANUAL'}]}});
    await loadInventory();
  } catch(e){ toast(e.message); }
}
async function loadCategories(){
  const d = await api('/categories');
  const el = document.getElementById('cat-list');
  if(!d.categories.length){ el.innerHTML = '<div class="empty">无品类</div>'; return; }
  el.innerHTML = d.categories.map(c=>`
    <div class="card">
      <div class="row"><span class="title">${esc(c.icon||'')} ${esc(c.name)}</span><span class="badge">${c.is_system?'系统':'自定义'}</span></div>
      <div class="meta">单位 ${esc(c.unit_type)}</div>
    </div>`).join('');
}
async function addCategory(){
  const name = document.getElementById('cat-name').value.trim();
  const unit = document.getElementById('cat-unit').value.trim() || '个';
  if(!name){ toast('请输入品类名'); return; }
  try { await api('/categories', {method:'POST', body:{name, icon:'📦', unit_type:unit}}); document.getElementById('cat-name').value=''; document.getElementById('cat-unit').value=''; await loadCategories(); }
  catch(e){ toast(e.message); }
}

/* ============ 生活·采购（建议 + 报告） ============ */
async function renderShop(m){
  m.innerHTML = `
    <div class="toolbar"><button onclick="genSuggestion()">生成采购建议</button></div>
    <div id="sug-list" class="empty"></div>
    <div class="section">本月消费报告</div>
    <div id="report-box" class="empty"></div>`;
  await loadSuggestion(); await loadReport();
}
async function loadSuggestion(){
  try {
    const d = await api('/suggestions/latest');
    const s = d.suggestion;
    const el = document.getElementById('sug-list');
    if(!s.items || !s.items.length){ el.innerHTML = '<div class="empty">暂无采购建议，点击「生成」</div>'; return; }
    el.innerHTML = '<div class="section">采购建议</div>' + s.items.map(i=>`
      <div class="card">
        <div class="row"><span class="title">${esc(i.item_key)}</span><span class="badge">${i.suggested_qty} ${esc(i.unit)}</span></div>
        <div class="meta">${esc(i.reason||'')}</div>
      </div>`).join('');
  } catch(e){ toast(e.message); }
}
async function genSuggestion(){
  try { await api('/suggestions/generate', {method:'POST', body:{mode:'AUTO'}}); await loadSuggestion(); } catch(e){ toast(e.message); }
}
async function loadReport(){
  const month = new Date().toISOString().slice(0,7);
  try {
    const d = await api('/reports/consumption/monthly?month='+month);
    const r = d.report;
    document.getElementById('report-box').innerHTML = `<div class="card"><div class="meta">${esc(r.month)} · 总消耗 ${r.total_consumed_qty} · 总浪费 ${r.total_wasted_qty}</div></div>`;
  } catch(e){ document.getElementById('report-box').innerHTML = '<div class="empty">暂无报告</div>'; }
}

/* ============ 生活·家庭 ============ */
async function renderFamily(m){
  m.innerHTML = `
    <div id="fam-info" class="empty">加载中…</div>
    <div class="toolbar">
      <input id="join-code" placeholder="输入邀请码加入家庭">
      <button onclick="joinFamily()">加入</button>
    </div>
    <button class="primary" style="background:var(--gold);color:#111;border:none;padding:10px 16px;border-radius:10px;font-weight:600;margin-bottom:10px;" onclick="invite()">生成邀请码</button>
    <div id="invite-box"></div>`;
  await loadFamily();
}
async function loadFamily(){
  try {
    const d = await api('/households/me');
    const h = d.household;
    document.getElementById('fam-info').innerHTML = `
      <div class="card">
        <div class="row"><span class="title">${esc(h.name||'我的家')}</span><span class="badge">${(h.members||[]).length} 成员</span></div>
        ${(h.members||[]).map(mm=>`<div class="meta">· ${esc(mm.phone_masked||'成员')}（${esc(mm.role||'')}）</div>`).join('')}
      </div>`;
  } catch(e){ document.getElementById('fam-info').innerHTML = '<div class="empty">暂无家庭</div>'; }
}
async function invite(){
  try { const d = await api('/households/invitations', {method:'POST', body:{role:'MEMBER'}}); document.getElementById('invite-box').innerHTML = `<div class="card">邀请码：<b>${esc(d.invitation.invite_code)}</b></div>`; }
  catch(e){ toast(e.message); }
}
async function joinFamily(){
  const code = document.getElementById('join-code').value.trim();
  if(!code){ toast('请输入邀请码'); return; }
  try { await api('/households/join', {method:'POST', body:{invite_code:code}}); document.getElementById('join-code').value=''; await loadFamily(); } catch(e){ toast(e.message); }
}

/* ============ 关系 ============ */
async function renderRelations(m){
  m.innerHTML = `
    <div class="card">
      <div class="section" style="margin:0 0 8px;">添加重要的人</div>
      <div class="toolbar">
        <input id="ct-name" placeholder="姓名" style="max-width:100px;">
        <input id="ct-rel" placeholder="关系" style="max-width:80px;">
        <input id="ct-birthday" placeholder="生日 MM-DD" style="max-width:110px;">
      </div>
      <button class="primary" style="background:var(--gold);color:#111;border:none;padding:10px 16px;border-radius:10px;font-weight:600;" onclick="addContact()">添加</button>
      <button style="background:#2a2f3a;color:var(--text);border:none;padding:10px 16px;border-radius:10px;font-weight:600;margin-top:8px;" onclick="loadStale()">久未联系</button>
    </div>
    <div id="stale-box"></div>
    <div id="contact-list" class="empty">加载中…</div>`;
  await loadContacts();
}
async function loadContacts(){
  const d = await api('/contacts');
  const el = document.getElementById('contact-list');
  if(!d.contacts.length){ el.innerHTML = '<div class="empty">暂无联系人，先添加重要的人</div>'; return; }
  el.innerHTML = d.contacts.map(c=>`
    <div class="card">
      <div class="row"><span class="title">${esc(c.name)}</span><span class="badge">${esc(c.relationship||'联系人')}</span></div>
      <div class="meta">生日 ${esc(c.birthday||'—')}${c.notes?' · '+esc(c.notes):''}</div>
      <div class="actions">
        <button class="primary" onclick="recordInteraction('${c.contact_id}','${esc(c.name)}')">记互动</button>
        <button onclick="suggestGift('${c.contact_id}')">礼物建议</button>
        <button class="danger" onclick="delContact('${c.contact_id}')">删除</button>
      </div>
    </div>`).join('');
}
async function addContact(){
  const name = document.getElementById('ct-name').value.trim();
  const rel = document.getElementById('ct-rel').value.trim();
  const bd = document.getElementById('ct-birthday').value.trim();
  if(!name){ toast('请输入姓名'); return; }
  try {
    await api('/contacts', {method:'POST', body:{name, relationship: rel||null, birthday: bd||null}});
    document.getElementById('ct-name').value=''; document.getElementById('ct-rel').value=''; document.getElementById('ct-birthday').value='';
    await loadContacts();
  } catch(e){ toast(e.message); }
}
async function delContact(id){ try { await api('/contacts/'+id, {method:'DELETE'}); await loadContacts(); } catch(e){ toast(e.message); } }
async function recordInteraction(id, name){
  const ch = prompt('互动方式（电话/微信/见面）：', '微信');
  if(!ch) return;
  const note = prompt('备注（可空）：', '');
  try { await api('/contacts/'+id+'/interactions', {method:'POST', body:{channel: ch, note: note||null}}); toast('已记录与「'+name+'」的互动'); }
  catch(e){ toast(e.message); }
}
async function suggestGift(id){
  try {
    const d = await api('/contacts/'+id+'/gifts', {method:'POST', body:{}});
    toast('礼物建议：'+d.suggestion.content);
  } catch(e){ toast(e.message); }
}
async function loadStale(){
  try {
    const d = await api('/contacts/stale?days=30');
    const box = document.getElementById('stale-box');
    if(!d.contacts.length){ box.innerHTML = '<div class="empty">最近 30 天都有保持联系 👍</div>'; return; }
    box.innerHTML = '<div class="section">久未联系（该问候了）</div>' + d.contacts.map(c=>`<div class="card"><div class="meta">${esc(c.name)}${c.relationship?'（'+esc(c.relationship)+'）':''} · ${c.days_since} 天未联系</div></div>`).join('');
  } catch(e){ toast(e.message); }
}

/* ============ 职业 ============ */
async function renderCareer(m){
  m.innerHTML = `
    <div class="card">
      <button class="primary" style="background:var(--blue);color:#fff;border:none;padding:12px 16px;border-radius:10px;font-weight:600;width:100%;" onclick="getAdvice()">🎯 AI 职业顾问 · 生成成长建议</button>
      <div id="advice-box"></div>
    </div>

    <div class="card">
      <div class="section" style="margin:0 0 8px;">添加职业目标</div>
      <div class="toolbar">
        <input id="cg-title" placeholder="目标（如：晋升高级工程师）" style="max-width:150px;">
        <input id="cg-year" placeholder="目标年 2027" style="max-width:96px;" inputmode="numeric">
      </div>
      <button class="primary" style="background:var(--blue);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;" onclick="addGoal()">添加目标</button>
    </div>
    <div id="goal-list" class="empty">加载中…</div>

    <div class="card">
      <div class="section" style="margin:0 0 8px;">技能与成长</div>
      <div class="toolbar">
        <input id="sk-name" placeholder="技能（如：Python）" style="max-width:110px;">
        <input id="sk-level" placeholder="当前 1-5" style="max-width:76px;" inputmode="numeric">
        <input id="sk-target" placeholder="目标 1-5" style="max-width:76px;" inputmode="numeric">
      </div>
      <button class="primary" style="background:var(--blue);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;" onclick="addSkill()">添加技能</button>
    </div>
    <div id="skill-list" class="empty">加载中…</div>

    <div class="card">
      <div class="section" style="margin:0 0 8px;">求职跟踪</div>
      <div class="toolbar">
        <input id="ja-company" placeholder="公司" style="max-width:100px;">
        <input id="ja-position" placeholder="岗位" style="max-width:110px;">
      </div>
      <button class="primary" style="background:var(--blue);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;" onclick="addApplication()">添加投递</button>
    </div>
    <div id="app-list" class="empty">加载中…</div>

    <div class="card">
      <div class="section" style="margin:0 0 8px;">学习计划</div>
      <div class="toolbar">
        <input id="li-title" placeholder="学习内容" style="max-width:110px;">
        <select id="li-type" style="background:#2a2f3a;color:var(--text);border:none;padding:10px 12px;border-radius:10px;">
          <option value="course">课程</option>
          <option value="book">书籍</option>
          <option value="cert">认证</option>
        </select>
      </div>
      <button class="primary" style="background:var(--blue);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;" onclick="addLearningItem()">添加学习</button>
    </div>
    <div id="learning-list" class="empty">加载中…</div>`;
  await Promise.all([loadGoals(), loadSkills(), loadApplications(), loadLearningItems()]);
}
async function loadGoals(){
  const d = await api('/career-goals');
  const el = document.getElementById('goal-list');
  if(!d.goals.length){ el.innerHTML = '<div class="empty">暂无职业目标，先设定一个长期目标</div>'; return; }
  el.innerHTML = d.goals.map(g=>`
    <div class="card">
      <div class="row"><span class="title">${esc(g.title)}</span><span class="badge">${g.status==='COMPLETED'?'已完成':g.status==='ARCHIVED'?'已归档':'进行中'}</span></div>
      <div class="meta">${g.target_year?'目标年 '+g.target_year+' · ':''}进度 ${g.progress}%</div>
      <div style="height:6px;background:#2a2f3a;border-radius:3px;margin:6px 0;"><div style="height:6px;width:${g.progress}%;background:var(--blue);border-radius:3px;"></div></div>
      <div class="actions">
        <button onclick="bumpGoal('${g.goal_id}',${g.progress})">+10%</button>
        <button onclick="finishGoal('${g.goal_id}')">完成</button>
        <button class="danger" onclick="delGoal('${g.goal_id}')">删除</button>
      </div>
    </div>`).join('');
}

async function loadSkills(){

      <div class="row"><span class="title">${esc(s.name)}</span><span class="badge">${gap>0?'缺口 '+gap:'已达标'}</span></div>

async function loadApplications(){
  const d = await api('/job-applications');
  const el = document.getElementById('app-list');
  if(!d.applications.length){ el.innerHTML = '<div class="empty">暂无投递，记录你的求职进度</div>'; return; }
  const ST = {APPLIED:'已投递', INTERVIEW:'面试中', OFFER:'已 Offer', REJECTED:'已拒绝'};
  el.innerHTML = d.applications.map(a=>{
    let adv = '';
    if(a.status==='APPLIED') adv = '<button onclick="advanceApplication(\''+a.application_id+'\',\'INTERVIEW\')">进面试</button>';
    else if(a.status==='INTERVIEW') adv = '<button onclick="advanceApplication(\''+a.application_id+'\',\'OFFER\')">拿 Offer</button><button class="danger" onclick="advanceApplication(\''+a.application_id+'\',\'REJECTED\')">拒绝</button>';
    return `<div class="card">
      <div class="row"><span class="title">${esc(a.company)}</span><span class="badge">${ST[a.status]||a.status}</span></div>
      <div class="meta">${esc(a.position)}${a.notes?' · '+esc(a.notes):''}</div>
      <div class="actions">${adv}<button class="danger" onclick="delApplication('${a.application_id}')">删除</button></div>
    </div>`;
  }).join('');
}

async function loadLearningItems(){

async function renderTasks(m){
  m.innerHTML = `
    <div class="toolbar">
      <input id="t-title" placeholder="新任务标题">

    </div>
    <div id="task-list" class="empty">加载中…</div>`;
  await loadTasks();
}
async function loadTasks(){
  const d = await api('/tasks/prioritize', {method:'POST'});
  const el = document.getElementById('task-list');
  const tag = d.method==='ai' ? '<span class="badge ai">AI 排序</span>' : '<span class="badge heuristic">启发式</span>';
  if (!d.tasks.length){ el.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  el.innerHTML = d.tasks.map(t=>`
    <div class="card">
      <div class="row"><span class="title">${esc(t.title)}</span>${tag}</div>
      <div class="meta">${esc(t.reason||'')} · P${t.priority}${t.due_at?' · '+esc(t.due_at.slice(0,10)):''}</div>
      <div class="actions">
        ${t.status!=='DONE'?'<button class="primary" onclick="setTaskDone(\''+t.task_id+'\')">完成</button>':''}
        <button class="danger" onclick="delTask(\''+t.task_id+'\')">删除</button>
      </div>
    </div>`).join('');
}
async function addTask(){
  const title = document.getElementById('t-title').value.trim();
  const priority = document.getElementById('t-priority').value;
  if(!title){ toast('请输入标题'); return; }
  try { await api('/tasks', {method:'POST', body:{title, priority:parseInt(priority)}}); document.getElementById('t-title').value=''; await loadTasks(); }
  catch(e){ toast(e.message); }
}
async function setTaskDone(id){ try { await api('/tasks/'+id, {method:'PATCH', body:{status:'DONE'}}); await loadTasks(); } catch(e){ toast(e.message); } }
async function delTask(id){ try { await api('/tasks/'+id, {method:'DELETE'}); await loadTasks(); } catch(e){ toast(e.message); } }

async function renderCalendar(m){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth()+1, 1);
  const s = fmtDate(start), e = fmtDate(end);
  const d = await api('/calendar/events?start_date='+s+'&end_date='+e);
  m.innerHTML = `
    <div class="row" style="margin-bottom:12px;">
      <div class="section" style="margin:0;">${now.getFullYear()} 年 ${now.getMonth()+1} 月</div>
      <div style="display:flex;gap:8px;">
        <button style="background:var(--gold);color:#111;border:none;padding:8px 14px;border-radius:8px;font-weight:600;" onclick="downloadIcs()">下载 .ics</button>
        <button style="background:#2a2f3a;color:var(--text);border:none;padding:8px 14px;border-radius:8px;font-weight:600;" onclick="copyShareUrl()">订阅链接</button>
      </div>
    </div>
    <div id="cal-list"></div>`;
  const el = document.getElementById('cal-list');
  if(!d.events.length){ el.innerHTML = '<div class="empty">本月暂无日程</div>'; return; }
  el.innerHTML = d.events.map(ev=>`
    <div class="card">
      <div class="row"><span class="title">${esc(ev.title)}</span><span class="badge">${ev.source==='meeting'?'会议':ev.source==='occasion'?'纪念日':'任务'}</span></div>
      <div class="meta">${esc((ev.start_at||'').slice(0,16).replace('T',' '))}</div>
    </div>`).join('');
}
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function downloadIcs(){
  try {
    const res = await fetch(API + '/calendar/ical', {headers:{'Authorization':'Bearer '+token, 'X-Request-Id':'web','X-App-Version':'1.1.0','X-Platform':'web-mobile'}});
    if(!res.ok){ toast('导出失败'); return; }
    const blob = await res.blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'calendar.ics'; a.click();
  } catch(e){ toast(e.message); }
}
async function copyShareUrl(){
  try {
    const d = await api('/calendar/share');
    const url = API + '/calendar/ical/public?token=' + encodeURIComponent(d.token);
    try { await navigator.clipboard.writeText(url); toast('订阅链接已复制'); }
    catch(e){ prompt('复制此订阅链接：', url); }
  } catch(e){ toast(e.message); }
}

      <div class="row"><span class="title">${esc(mt.title)}</span></div>
      <div class="meta">${esc((mt.summary||'（无摘要）').slice(0,120))}</div>
      ${mt.action_items.length?`<div class="section">待办</div>`+mt.action_items.map(a=>`
        <div class="row" style="padding:6px 0;"><span style="font-size:13px;${a.done?'text-decoration:line-through;color:var(--muted);':''}">${esc(a.text)}${a.assignee?' · '+esc(a.assignee):''}</span>${a.done?'<span class="badge DONE">完成</span>':'<button style="background:#2a2f3a;color:var(--text);border:none;padding:5px 10px;border-radius:6px;" onclick="doneItem(\''+a.action_item_id+'\')">完成</button>'}</div>`).join(''):''}

async function addMeeting(){
  const title = document.getElementById('mt-title').value.trim();

async function doneItem(id){ try { await api('/meetings/action-items/'+id, {method:'PATCH', body:{done:true}}); await loadMeetings(); } catch(e){ toast(e.message); } }
